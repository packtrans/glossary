[package]
name = "packtrans-glossary"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap.workspace = true
indicatif = "0.17"
lindera.workspace = true
lindera-tantivy.workspace = true
lru.workspace = true
packtrans-glossary-core = { path = "../packtrans-glossary-core" }
rmcp = { version = "2.2", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tantivy = { workspace = true, features = ["mmap", "stopwords"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
ureq = { workspace = true, features = ["json"] }
zip.workspace = true

[[bin]]
name = "packtrans-glossary"
path = "src/main.rs"
