[workspace]
members = [
    "crates/packtrans-glossary-core",
    "crates/packtrans-glossary",
    "crates/packtrans-glossary-builder",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lindera = "2"
lindera-tantivy = { version = "2", features = ["embed-ipadic", "embed-ko-dic"] }
serde_json = "1"
tantivy = "0.25"
tantivy-jieba = "0.18"
