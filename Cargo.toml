[workspace]
members = [
    "crates/packtrans-glossary-core",
    "crates/packtrans-glossary",
    "crates/packtrans-glossary-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lindera = "4"
lru = "0.12"
lindera-tantivy = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.25"
ureq = "2"
zip = "2"
