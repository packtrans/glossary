[workspace]
members = [
    "crates/packtrans-glossary-core",
    "crates/packtrans-glossary",
    "crates/packtrans-glossary-builder",
    "crates/packtrans-glossary-wasm",
    "crates/lindera-tantivy-patch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lindera = { version = "2", default-features = false, features = ["compress"] }
lindera-dictionary = { version = "2", default-features = false, features = ["compress"] }
lindera-tantivy = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "0.25", default-features = false, features = ["lz4-compression"] }
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["js"] }
rkyv = "0.8"

[patch.crates-io]
lindera-tantivy = { path = "crates/lindera-tantivy-patch" }
