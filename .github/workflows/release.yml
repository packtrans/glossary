name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Smaller release binaries (supported on MSVC/gnu/darwin).
  RUSTFLAGS: -C strip=symbols

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Package Unix (${{ matrix.target }})
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE_DIR="packtrans-glossary-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp target/release/packtrans-glossary "${ARCHIVE_DIR}/"
          cp target/release/packtrans-glossary-builder "${ARCHIVE_DIR}/"
          tar -czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"

      - name: Package Windows (${{ matrix.target }})
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $archiveDir = "packtrans-glossary-${env:TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $archiveDir | Out-Null
          Copy-Item "target/release/packtrans-glossary.exe" $archiveDir/
          Copy-Item "target/release/packtrans-glossary-builder.exe" $archiveDir/
          Compress-Archive -Path $archiveDir -DestinationPath "${archiveDir}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            packtrans-glossary-${{ github.ref_name }}-${{ matrix.target }}.*

  publish-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@packtrans"

      - name: Build WASM npm package
        run: |
          wasm-pack build \
            --target bundler \
            --scope packtrans \
            --out-dir "$GITHUB_WORKSPACE/pkg" \
            crates/packtrans-glossary-wasm

      - name: Set package version and registry metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
            '.name = "@packtrans/glossary"
             | .version = $version
             | .repository = "git+https://github.com/packtrans/glossary.git"
             | .publishConfig = {"registry": "https://npm.pkg.github.com"}' \
            package.json > package.json.tmp
          mv package.json.tmp package.json
        working-directory: pkg

      - name: Publish to GitHub Packages
        run: npm publish --access public
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
