name: Release WASM

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@packtrans"

      - name: Build WASM npm package
        run: |
          wasm-pack build \
            --target bundler \
            --scope packtrans \
            --out-dir "$GITHUB_WORKSPACE/pkg" \
            crates/packtrans-glossary-wasm

      - name: Set package version and registry metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
            '.name = "@packtrans/glossary"
             | .version = $version
             | .repository = "git+https://github.com/packtrans/glossary.git"
             | .publishConfig = {"registry": "https://npm.pkg.github.com"}' \
            package.json > package.json.tmp
          mv package.json.tmp package.json
        working-directory: pkg

      - name: Publish to GitHub Packages
        run: npm publish --access public
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
